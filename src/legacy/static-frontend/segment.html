<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MaskFlow SAM 分割页</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="mf-app">
    <header class="mf-top">
      <a class="marketing-brand" href="/index.html"><span class="logo-mark">M</span><strong>MaskFlow</strong></a>
      <nav class="mf-nav"><a href="/index.html#features">功能</a><a href="/billing.html">价格</a><a href="#">帮助文档</a><a href="#">博客</a></nav>
      <div class="marketing-actions"><a class="btn secondary" href="/auth.html">登录</a><a class="btn" href="/auth.html?mode=register">注册</a></div>
    </header>

    <main class="tool-page">
      <div class="sam-hero-title"><span>◌</span><h1 class="mf-title">SAM 分割页</h1></div>

      <section class="sam-grid">
        <aside class="sam-left">
          <form id="segmentForm">
            <label class="dropzone compact" for="imageInput">
              <input id="imageInput" name="image" type="file" accept="image/*" required />
              <span>+ 上传图片</span>
            </label>
            <input id="promptInput" name="prompt" type="text" placeholder="留空自动分割" style="margin-top:14px;width:100%;min-height:42px;border:1px solid #dfe7f3;border-radius:8px;padding:0 12px" />
            <label class="field" style="margin-top:12px"><span>置信度 <b id="confValue">0.25</b></span><input id="confInput" name="conf" type="range" min="0.01" max="0.95" step="0.01" value="0.25" /></label>
            <label class="toggle"><input id="halfInput" name="half" type="checkbox" checked />GPU FP16</label>
            <button id="submitButton" type="submit" style="width:100%;margin-top:12px">开始分割</button>
          </form>

          <div class="thumb-list">
            <div class="thumb-item active"><span class="thumb-art"></span><span id="fileName">image_001.jpg</span></div>
            <div class="thumb-item"><span class="thumb-art"></span><span>image_002.jpg</span></div>
            <div class="thumb-item"><span class="thumb-art"></span><span>image_003.jpg</span></div>
            <div class="thumb-item"><span class="thumb-art"></span><span>image_004.jpg</span></div>
            <div class="thumb-item"><span class="thumb-art"></span><span>image_005.jpg</span></div>
            <div class="thumb-item"><span class="thumb-art"></span><span>image_006.jpg</span></div>
          </div>
          <button class="secondary" type="button" style="width:100%;margin-top:18px">↥ 上传更多</button>
        </aside>

        <section class="sam-center">
          <div class="section-head"><h2 id="resultTitle">SAM 分割</h2><span id="statusText" class="muted">正在读取模型状态</span></div>
          <div class="tool-strip">
            <button class="active" type="button">↖</button><span>⊕</span><span>⊖</span><span>⊕</span><span>|</span><span>✋</span><strong>100%⌄</strong>
            <span style="margin-left:auto">↶ 撤销　↷ 重做</span>
          </div>
          <div class="segment-canvas">
            <div class="canvas-wrap">
              <div class="mock-photo"><div class="mock-road"></div><div class="mock-car"></div></div>
              <img id="previewImage" alt="SAM segmentation result" />
              <div id="emptyState">点击上传图片后开始分割</div>
            </div>
          </div>
          <div class="tool-footer">
            <span>● AI 图像：<b>正常</b></span><span id="resultMeta">当前图片：image_001.jpg</span><span>标注状态：<b>已保存</b></span><span>分割模式：交互分割</span>
          </div>
        </section>

        <aside class="sam-right">
          <h2>AI 分割状态</h2>
          <p>当前模式： <b style="color:#f59e0b">正在分割</b></p>
          <div class="progress-line"><span>预计耗时：约 18 秒</span><b>60%</b></div>
          <div class="progress"><i style="width:60%"></i></div>
          <p style="margin:34px 0">图片数量： 1 / 1 张</p>

          <h2 style="margin-top:56px">分割模式</h2>
          <div class="mode-list">
            <label class="active"><input type="radio" checked />自动分割</label>
            <label><input type="radio" />点选分割</label>
            <label><input type="checkbox" />框选分割</label>
          </div>
          <div id="categoryList" class="category-list" style="margin-bottom:18px">
            <button class="category-item active" type="button" disabled><span>全部</span><b>0</b></button>
          </div>
          <button class="secondary" type="button" style="width:100%">取消处理</button>
        </aside>
      </section>
    </main>
    <script src="/shared.js"></script>
    <script src="/segment.js"></script>
  </body>
</html>
