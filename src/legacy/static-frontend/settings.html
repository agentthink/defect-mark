<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MaskFlow 账户设置</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="mf-app">
    <header class="mf-top">
      <a class="marketing-brand" href="/dashboard.html"><span class="logo-mark">M</span><strong>MaskFlow</strong></a>
      <nav class="mf-nav">
        <a href="/dashboard.html">控制台</a>
        <a href="/records.html">项目管理</a>
        <a href="/annotate.html">标注工具</a>
        <a href="/export.html">数据集</a>
        <a href="/billing.html">训练模型</a>
        <a href="/files.html">文档中心</a>
      </nav>
      <div class="mf-userbar">
        <button class="icon-btn" type="button">♧<span class="dot">1</span></button>
        <button class="icon-btn" type="button">?</button>
        <span class="user-mini"><span class="avatar">M</span>MaskFlow User⌄</span>
      </div>
    </header>

    <main class="mf-content">
      <section class="settings-page">
        <aside class="mf-card settings-card">
          <nav class="settings-nav">
            <a class="active" href="#"><span>♙</span>个人信息</a>
            <a href="#"><span>▣</span>修改密码</a>
            <a href="#"><span>♢</span>通知设置</a>
            <a href="#"><span>⚿</span>API Token</a>
            <a href="#"><span>♧</span>团队管理</a>
            <a href="#"><span>▧</span>设备管理</a>
          </nav>
        </aside>

        <section class="mf-card settings-main">
          <h1 class="mf-title" style="font-size:24px">个人信息</h1>
          <h2 style="margin:46px 0 0;font-size:18px">头像</h2>
          <div class="profile-avatar-row">
            <div class="profile-avatar">M<span class="profile-camera">▣</span></div>
            <div>
              <button class="btn secondary" type="button">更换头像</button>
              <p class="muted">支持 JPG、PNG 格式，大小不超过 5MB</p>
            </div>
          </div>

          <h2 style="font-size:22px">用户信息</h2>
          <div class="settings-form">
            <div class="form-row"><label>用户名</label><input value="MaskFlow User" /></div>
            <div class="form-row"><label>邮箱</label><input id="settingsEmail" value="user@example.com" /></div>
            <div class="form-row"><label>手机号码</label><input value="139****1234" /></div>
            <button class="wide-button" type="button">保存修改</button>
          </div>
        </section>
      </section>
    </main>
    <script src="/shared.js"></script>
    <script>
      MaskFlowAuth.requireLogin();
      const u = MaskFlowAuth.user();
      if (u && u.email) document.querySelector("#settingsEmail").value = u.email;
    </script>
  </body>
</html>
