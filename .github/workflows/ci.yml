name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/maskflow-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/maskflow-web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore maskflow-api.tests/MaskFlow.Api.Tests.csproj
      - run: dotnet test maskflow-api.tests/MaskFlow.Api.Tests.csproj --configuration Release --no-restore

  python:
    name: Python checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ai/sam-inference
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m compileall -q app

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose config --quiet
